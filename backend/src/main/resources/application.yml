spring:
  application:
    name: wildai-backend
  datasource:
    url: jdbc:mysql://localhost:3306/wildai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: wildai
    password: wildai123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

wildai:
  jwt:
    secret: change-me-in-production-use-256-bit-secret-key!!
    user-access-expiration-minutes: 30
    user-refresh-expiration-days: 7
    admin-access-expiration-minutes: 480
  aes:
    secret-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  order:
    expire-minutes: 15
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:RechargeAi <noreply@rechargeai.local>}
  payment:
    mock-enabled: ${WILDAI_PAYMENT_MOCK_ENABLED:true}
    xunhupay:
      appid: ${XUNHUPAY_APPID:}
      secret: ${XUNHUPAY_SECRET:}
      gateway: ${XUNHUPAY_GATEWAY:https://api.xunhupay.com}
      notify-url: ${XUNHUPAY_NOTIFY_URL:}
      return-url: ${XUNHUPAY_RETURN_URL:}
      callback-url: ${XUNHUPAY_CALLBACK_URL:}
      timeout-seconds: ${XUNHUPAY_TIMEOUT_SECONDS:10}
  finance:
    min-withdraw-amount: 100
    max-daily-withdraw-amount: 50000
    max-pending-withdrawals: 3
    payout-timeout-days: 7

logging:
  level:
    com.wildai: INFO
