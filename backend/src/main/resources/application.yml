spring:
  application:
    name: wildai-backend
  datasource:
    url: jdbc:mysql://localhost:3306/wildai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: wildai
    password: wildai123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

wildai:
  jwt:
    secret: change-me-in-production-use-256-bit-secret-key!!
    user-access-expiration-minutes: 30
    user-refresh-expiration-days: 7
    admin-access-expiration-minutes: 480
  aes:
    secret-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  order:
    expire-minutes: 15
  payment:
    mock-enabled: true

logging:
  level:
    com.wildai: INFO
