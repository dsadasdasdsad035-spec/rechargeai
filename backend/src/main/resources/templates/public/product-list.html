<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{public/fragments :: head(${seo})}">
  <title>AI 订阅产品 | RechargeAi</title>
</head>
<body>
<header th:replace="~{public/fragments :: siteHeader}"></header>
<main class="page">
  <header class="page-heading">
    <h1>AI 订阅服务</h1>
    <p>选择您需要的 AI 服务，我们将协助完成订阅流程</p>
  </header>
  <section class="product-grid" aria-label="产品列表" th:if="${!products.isEmpty()}">
    <a class="card product-card" th:each="product : ${products}"
       th:href="@{/products/{id}(id=${product.id})}">
      <div class="product-card__top">
        <h2 class="product-card__name" th:text="${product.name}">产品名称</h2>
        <span class="product-card__eta" th:if="${product.estimatedHours != null}"
              th:text="|约 ${product.estimatedHours}h|">约 1h</span>
      </div>
      <div class="product-card__price">
        <span class="product-card__amount">
          <span th:text="${product.salePrice}">0.00</span>
          <span th:text="${product.currency}">CNY</span>
        </span>
        <span class="product-card__period" th:if="${product.periodDays != null}"
              th:text="|/ ${product.periodDays} 天|">/ 30 天</span>
      </div>
      <span class="product-card__cta">查看详情 →</span>
    </a>
  </section>
  <p class="empty-state" th:if="${products.isEmpty()}">当前没有可订阅的产品，请稍后再来。</p>
</main>
</body>
</html>
