openapi: 3.0.3
info:
  title: RechargeAi 订阅助手 - 管理端 API（三期 · 资金与提现）
  version: 3.0.0
  description: |
    设计契约，三期实现。依赖二期 RBAC/审计与退款闭环。
    可提现余额仅含 order_status=SUCCESS 订单实收。
    提现收款账户必选 PayoutAccount 预设。

servers:
  - url: /admin/api
    description: 管理端 API 前缀

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FinanceOverview:
      type: object
      properties:
        settledRevenue:
          type: number
          format: decimal
          description: 已结算实收（SUCCESS 订单）
        totalRefunded:
          type: number
          format: decimal
        availableBalance:
          type: number
          format: decimal
        frozenForWithdrawal:
          type: number
          format: decimal
        totalWithdrawn:
          type: number
          format: decimal

    PayoutAccountSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        accountName: { type: string }
        bankName: { type: string }
        accountLast4: { type: string }
        enabled: { type: boolean }

    WithdrawalRequest:
      type: object
      properties:
        withdrawalNo: { type: string }
        amount: { type: number, format: decimal }
        actualAmount: { type: number, format: decimal }
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
            - CANCELLED
            - COMPLETED
            - PAYOUT_TIMEOUT
        payoutAccountId: { type: integer, format: int64 }
        applicantName: { type: string }
        appliedAt: { type: string, format: date-time }

paths:
  /finance/overview:
    get:
      summary: 平台资金概览
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverview'

  /finance/ledger:
    get:
      summary: 账本流水分页
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entryType
          in: query
          schema:
            type: string
            enum: [SETTLE, REFUND, WITHDRAW_FREEZE, WITHDRAW_RELEASE, WITHDRAW_COMPLETE]
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }

  /payout-accounts:
    get:
      summary: 收款账户列表（超管维护，财务只读启用项）
      tags: [PayoutAccount]
      security: [{ bearerAuth: [] }]
    post:
      summary: 新增收款账户（超管）
      tags: [PayoutAccount]
      security: [{ bearerAuth: [] }]

  /payout-accounts/{id}:
    put:
      summary: 编辑/启用停用收款账户（超管）
      tags: [PayoutAccount]
      security: [{ bearerAuth: [] }]

  /withdrawals:
    get:
      summary: 提现单列表
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]
    post:
      summary: 创建提现申请（财务）
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payoutAccountId]
              properties:
                amount: { type: number, format: decimal }
                payoutAccountId: { type: integer, format: int64 }
                remark: { type: string }

  /withdrawals/{withdrawalNo}/approve:
    post:
      summary: 审批通过（超管）
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]

  /withdrawals/{withdrawalNo}/reject:
    post:
      summary: 审批驳回（超管）
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }

  /withdrawals/{withdrawalNo}/confirm-payout:
    post:
      summary: 确认打款（财务）
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [actualAmount, paidAt, externalVoucherNo]
              properties:
                actualAmount: { type: number, format: decimal }
                paidAt: { type: string, format: date-time }
                externalVoucherNo: { type: string }
                varianceReason: { type: string }

  /withdrawals/{withdrawalNo}/cancel:
    post:
      summary: 取消提现（申请人或超管，限定状态）
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]

  /withdrawals/export:
    get:
      summary: 导出提现单
      tags: [Withdrawal]
      security: [{ bearerAuth: [] }]
