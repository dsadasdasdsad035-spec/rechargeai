# 域名 HTTP → HTTPS
server {
    listen 80;
    server_name rechargeai.cn www.rechargeai.cn;
    return 301 https://rechargeai.cn$request_uri;
}

# IP / 未绑定域名：HTTP 直接访问（新服务器初始化或域名未切换时）
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 55m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.rechargeai.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    return 301 https://rechargeai.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rechargeai.cn;
    client_max_body_size 55m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}
