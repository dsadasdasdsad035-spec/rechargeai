services:
  mysql:
    image: mysql:8.0
    container_name: wildai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wildai
      MYSQL_USER: wildai
      MYSQL_PASSWORD: wildai123
    ports:
      - "3306:3306"
    volumes:
      - wildai-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: wildai-redis
    ports:
      - "6379:6379"
    volumes:
      - wildai-redis-data:/data

volumes:
  wildai-mysql-data:
  wildai-redis-data:
